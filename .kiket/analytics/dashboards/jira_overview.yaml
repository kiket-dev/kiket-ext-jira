name: "Jira Integration Overview"
description: "Overview of Jira projects, issue mappings, and sync status"
refresh_interval: 300

sections:
  - name: "Summary Metrics"
    layout: "grid"
    columns: 4
    widgets:
      - type: "metric"
        title: "Connected Projects"
        query: "SELECT COUNT(*) as value FROM jira_data.projects WHERE sync_enabled = true"
        icon: "folder"

      - type: "metric"
        title: "Active Mappings"
        query: "SELECT COUNT(*) as value FROM jira_data.issue_mappings WHERE sync_enabled = true"
        icon: "link"

      - type: "metric"
        title: "Sync Jobs Today"
        query: "SELECT COUNT(*) as value FROM jira_data.sync_jobs WHERE DATE(created_at) = CURRENT_DATE"
        icon: "refresh-cw"

      - type: "metric"
        title: "Success Rate"
        query: "SELECT ROUND(AVG(success_rate_pct), 1) || '%' as value FROM sync_metrics_daily WHERE sync_date >= CURRENT_DATE - INTERVAL '7 days'"
        icon: "check-circle"

  - name: "Sync Activity"
    layout: "full-width"
    widgets:
      - type: "line-chart"
        title: "Daily Sync Jobs"
        query: |
          SELECT
            sync_date as date,
            SUM(successful_jobs) as "Successful",
            SUM(failed_jobs) as "Failed"
          FROM sync_metrics_daily
          WHERE sync_date >= CURRENT_DATE - INTERVAL '30 days'
          GROUP BY sync_date
          ORDER BY sync_date
        x_axis: "date"
        y_axis: ["Successful", "Failed"]

  - name: "Project Performance"
    layout: "full-width"
    widgets:
      - type: "table"
        title: "Project Sync Status"
        query: |
          SELECT
            jira_project_key as "Jira Project",
            total_mappings as "Total Mappings",
            active_mappings as "Active",
            field_mappings_count as "Field Maps",
            status_mappings_count as "Status Maps",
            job_success_rate_pct as "Success Rate %",
            last_sync as "Last Sync"
          FROM project_summary
          ORDER BY total_mappings DESC
        page_size: 20

  - name: "Webhook Reliability"
    layout: "full-width"
    widgets:
      - type: "table"
        title: "Webhook Processing"
        query: |
          SELECT
            delivery_date as "Date",
            webhook_event as "Event",
            total_deliveries as "Total",
            successful_deliveries as "Success",
            failed_deliveries as "Failed",
            success_rate_pct as "Success Rate %"
          FROM webhook_processing
          WHERE delivery_date >= CURRENT_DATE - INTERVAL '7 days'
          ORDER BY delivery_date DESC
        page_size: 20

filters:
  - name: "project"
    label: "Jira Project"
    type: "select"
    query: "SELECT DISTINCT jira_project_key as value, jira_project_key as label FROM jira_data.projects ORDER BY jira_project_key"

  - name: "date_range"
    label: "Date Range"
    type: "date-range"
    default: "last_30_days"
