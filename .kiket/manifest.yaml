model_version: "1.0"
extension:
  id: dev.kiket.ext.jira
  name: Jira Integration
  version: 1.0.0
  description: Jira integration for bidirectional issue sync, status mapping, and attachment mirroring
  author: Kiket
  homepage: https://github.com/kiket-dev/kiket-ext-jira
  icon: https://wac-cdn.atlassian.com/assets/img/favicons/atlassian/favicon.png
  delivery: http
  callback:
    url: ${EXTENSION_BASE_URL}
    secret: env.JIRA_WEBHOOK_SECRET
    timeout: 30000
    required: true
  activationEvents:
    - issue.created
    - issue.transitioned
    - issue.updated
    - issue.commented
  permissions:
    - issues:read
    - issues:write
    - comments:read
    - comments:write
    - attachments:read
    - attachments:write
    - projects:read
  capabilities:
    - issue-sync
    - bidirectional-sync
    - status-mapping
    - attachment-mirroring
    - webhooks
  hooks:
    - event: issue.created
      endpoint: /webhooks/kiket/issue_created
      timeout: 5000
      retries: 1
      description: Create Jira issue when Kiket issue is created
    - event: issue.transitioned
      endpoint: /webhooks/kiket/issue_transitioned
      timeout: 5000
      retries: 1
      description: Sync status changes to Jira
    - event: issue.updated
      endpoint: /webhooks/kiket/issue_updated
      timeout: 5000
      retries: 1
      description: Sync issue updates to Jira
    - event: issue.commented
      endpoint: /webhooks/kiket/issue_commented
      timeout: 5000
      retries: 1
      description: Sync comments to Jira
  contributes:
    commands:
      - command: jira.syncIssue
        title: Sync with Jira
        description: Trigger sync for this issue
        category: Jira
        icon: bi-arrow-repeat
        keywords: ["jira", "sync", "issue"]
        context: issue
        handler:
          type: extension_event
          event: jira.syncIssue
      - command: jira.createMapping
        title: Map to Jira Issue
        description: Create mapping to existing Jira issue
        category: Jira
        icon: bi-link-45deg
        keywords: ["jira", "map", "link"]
        context: issue
        handler:
          type: extension_event
          event: jira.createMapping
      - command: jira.viewInJira
        title: View in Jira
        description: Open mapped Jira issue
        category: Jira
        icon: bi-box-arrow-up-right
        keywords: ["jira", "view", "open"]
        context: issue
        handler:
          type: extension_event
          event: jira.viewInJira
      - command: jira.syncProject
        title: Sync Jira Project
        description: Trigger full project sync
        category: Jira
        icon: bi-arrow-repeat
        keywords: ["jira", "sync", "project"]
        handler:
          type: extension_event
          event: jira.syncProject
      - command: jira.exportMappings
        title: Export Mappings
        description: Export issue mappings as CSV
        category: Jira
        icon: bi-download
        keywords: ["jira", "export", "csv"]
        handler:
          type: extension_event
          event: jira.exportMappings
  jira_webhooks:
    endpoint: /webhooks/jira
    events:
      - jira:issue_created
      - jira:issue_updated
      - jira:issue_deleted
      - comment_created
      - comment_updated
  custom_data:
    modules:
      - jira_data
  configuration:
    # Jira Instance
    JIRA_URL:
      type: string
      secret: false
      required: true
      label: Jira Instance URL
      description: "Jira instance URL (e.g., https://company.atlassian.net)"
    # Authentication - OAuth 2.0 (3LO)
    JIRA_ACCESS_TOKEN:
      type: string
      secret: true
      required: true
      label: Jira Access Token
      description: Atlassian OAuth 2.0 access token for API access
      oauth:
        provider: atlassian
        grant_type: authorization_code
        authorization_url: https://auth.atlassian.com/authorize
        token_url: https://auth.atlassian.com/oauth/token
        scopes:
          - read:jira-work
          - write:jira-work
          - read:jira-user
          - offline_access
        token_path: access_token
        refresh_token_path: refresh_token
        expires_in_path: expires_in
        extra_params:
          audience: api.atlassian.com
          prompt: consent
        client_id: ext.KIKET_ATLASSIAN_CLIENT_ID
        client_secret: ext.KIKET_ATLASSIAN_CLIENT_SECRET
    # Legacy API Token Authentication (alternative to OAuth)
    JIRA_EMAIL:
      type: string
      secret: false
      required: false
      label: Jira Email
      description: Jira user email (required if using API token instead of OAuth)
    JIRA_API_TOKEN:
      type: string
      secret: true
      required: false
      label: Jira API Token
      description: Jira API token (alternative to OAuth - requires email)
    # Webhook Secret
    JIRA_WEBHOOK_SECRET:
      type: string
      secret: true
      required: false
      label: Jira Webhook Secret
      description: Secret for verifying Jira webhook signatures
    # Settings
    default_sync_direction:
      type: string
      default: "bidirectional"
      label: Default Sync Direction
      description: Default synchronization direction (bidirectional, jira_to_kiket, kiket_to_jira)
    auto_create_mappings:
      type: boolean
      default: "false"
      label: Auto-create Mappings
      description: Automatically create issue mappings when Jira issues are created
    sync_comments:
      type: boolean
      default: "true"
      label: Sync Comments
      description: Synchronize comments between Jira and Kiket
    sync_attachments:
      type: boolean
      default: "true"
      label: Sync Attachments
      description: Mirror attachments between Jira and Kiket
  rate_limiting:
    requests_per_minute: 60
    burst: 20
  # Setup Wizard - guides users through extension configuration
  setup:
    # Step 1: Jira Instance URL
    - configure:
        title: Connect to Jira
        description: Enter your Jira Cloud instance URL
        required: true
        collect:
          - JIRA_URL

    # Step 2: OAuth 2.0 Authorization
    - secrets:
        title: Authorize Jira Access
        description: Connect your Atlassian account to enable issue sync
        required: true
        collect:
          - JIRA_ACCESS_TOKEN

    # Step 3: Sync Configuration
    - configure:
        title: Configure Sync Settings
        description: Set up how issues are synchronized between Jira and Kiket
        collect:
          - default_sync_direction
          - sync_comments
          - sync_attachments
          - auto_create_mappings

    # Step 4: Test Connection
    - test:
        title: Test Connection
        description: Verify your Jira connection is working
        action: jira.testConnection
        successMessage: Successfully connected to Jira! Projects are accessible.
        required: false

    # Step 5: Getting Started Info
    - info:
        title: Setup Complete
        content: |
          ## You're all set! 🎉

          Your Jira integration is now configured. Here's what happens next:

          - **Issue sync** will keep Kiket and Jira in sync
          - **Status mappings** can be configured in project settings
          - **Comments and attachments** will be mirrored automatically

          ### Next Steps

          1. Configure status mappings in Project Settings → Jira
          2. Select which Jira projects to sync
          3. Import existing Jira issues if needed

          ### Available Commands

          - `/jira.syncIssue` - Manually sync an issue
          - `/jira.createMapping` - Link to existing Jira issue
          - `/jira.viewInJira` - Open issue in Jira
        links:
          - label: Atlassian Admin Console
            url: https://admin.atlassian.com/
            icon: gear
          - label: Kiket Documentation
            url: https://docs.kiket.dev/extensions/jira
            icon: book

  custom_data:
    permissions:
      - module: dev.kiket.ext.jira.data
        operations: [read, write]
  assets:
    icon: ./public/icon.svg
  hosting: internal
  tags:
    - integration
    - jira
    - issue-tracking
    - project-management
    - atlassian
